# The reference application under test (Toolshop), as published Docker images.
# Used by `npm run app:start` and the GitHub Actions workflow, so every environment runs the same thing.
# No application source is needed.
#
# Images are pinned by digest so a change upstream cannot break the suite unnoticed. To update a pin:
#   docker pull <image>:latest && docker image inspect <image>:latest --format '{{index .RepoDigests 0}}'
# then paste the digest here and run the suite.
#
# Ports: UI http://localhost:4200, API http://localhost:8091. The UI calls the API at localhost:8091,
# so both must be reachable on localhost from the browser that runs the tests.
#
# Platforms are explicit because the images are single-architecture: api and ui are amd64, web is arm64.
# Docker Desktop emulates whichever one your CPU lacks. On a plain Linux host, enable arm64 emulation once:
#   docker run --privileged --rm tonistiigi/binfmt --install arm64
name: toolshop

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11@sha256:8bb25ca2d68c81118fcf745959560de2f316a178abf9decc8bb5b6f86c929084
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  laravel-api:
    # tag: latest
    image: testsmith/practice-software-testing-sprint5-api@sha256:881cb7ecd76477994728648c0c16f6e9d2beed0f0217734843a32a7bb92553f0
    platform: linux/amd64
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
      DB_PORT: '3306'
      DB_HOST: mariadb
      host: localhost
    depends_on:
      - mariadb

  web:
    # tag: latest
    image: testsmith/practice-software-testing-web@sha256:950bafdc86501002c381e35d9b70e298fe211f4ab1fbfda334b67f03dffa048d
    platform: linux/arm64
    ports:
      - '8091:80'
    depends_on:
      - laravel-api

  angular-ui:
    # tag: latest
    image: testsmith/practice-software-testing-sprint5-ui@sha256:f907d8daae32dc90ba900e964928d00bf0aabfab7067eaeeaa49f5a0f70c52e6
    platform: linux/amd64
    ports:
      - '4200:4200'
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
