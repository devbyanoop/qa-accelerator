name: QA Accelerator CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly, 02:00 UTC, on all browsers
  workflow_dispatch:
    inputs:
      capture_all:
        description: Record a screenshot, video and trace for every test
        type: boolean
        default: false
      regulated_pack:
        description: Also build the regulated evidence pack (traceability, single report, checksums)
        type: boolean
        default: false
      all_browsers:
        description: Run on Chromium, Firefox, WebKit and a phone-sized Chrome
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:tools
      - run: npm run check:actions

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests use Chromium only to stay fast; the nightly run and manual runs can use all three.
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.all_browsers) && '["chromium","firefox","webkit","mobile-chrome"]' || '["chromium"]') }}
    env:
      CI: 'true'
      TEST_ENV: ci
      BROWSERS: ${{ matrix.browser }}
      UI_URL: http://localhost:4200
      API_URL: http://localhost:8091
      APP_NAME: Toolshop
      # The database of the containers started below (see infra/toolshop/docker-compose.yml). These are the
      # throwaway credentials of that local container, not secrets.
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_USER: user
      DB_PASSWORD: root
      DB_NAME: toolshop
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser == 'mobile-chrome' && 'chromium' || matrix.browser }}

      # The application's web image is arm64-only; QEMU lets the x64 runner run it.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      # Starts the Toolshop containers from infra/toolshop, seeds the database and waits until it is ready.
      - name: Start the application under test
        run: npm run app:start

      - name: Restore Allure history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .allure
          key: allure-history-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: allure-history-${{ matrix.browser }}-

      - name: Run tests
        run: npx playwright test ${{ inputs.capture_all && '--config=playwright.capture.config.ts' || '' }}

      # Advisory: a mismatch is reported but never fails the build. The baselines were rendered in the Playwright
      # image, whose fonts differ from the plain runner's, so the comparison runs in that same image. Keep the tag
      # in step with @playwright/test and the Dockerfile.
      - name: Visual checks (advisory)
        if: ${{ matrix.browser == 'chromium' && !cancelled() }}
        continue-on-error: true
        run: >
          docker run --rm --init --ipc=host --network host
          -v "$PWD:/work" -w /work
          -e CI=true -e TEST_ENV=ci -e VISUAL=true -e BROWSERS=chromium
          -e UI_URL -e API_URL -e APP_NAME
          -e CUSTOMER_EMAIL -e CUSTOMER_PASSWORD -e ADMIN_EMAIL -e ADMIN_PASSWORD
          mcr.microsoft.com/playwright:v1.64.1-noble
          npx playwright test tests/ui/visual --reporter=list --output=reports/_raw/visual

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate reports/_raw/allure-results --clean --config config/allurerc.mjs

      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .allure
          key: allure-history-${{ matrix.browser }}-${{ github.run_id }}

      # Regulated evidence pack: only when asked for (Run workflow, "regulated pack"). Everyday runs produce the
      # standard reports only. For a full validation run tick "capture_all" as well. Keep the pack longer than the
      # other artifacts by setting the repository variable EVIDENCE_RETENTION_DAYS (see docs/reporting.md).
      - name: Build evidence pack
        if: ${{ !cancelled() && inputs.regulated_pack }}
        run: npm run evidence

      - name: Upload evidence pack
        if: ${{ !cancelled() && inputs.regulated_pack }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.browser }}
          path: reports/regulated
          retention-days: ${{ vars.EVIDENCE_RETENTION_DAYS || 90 }}

      - name: Application logs (on failure)
        if: failure()
        run: docker compose -f infra/toolshop/docker-compose.yml logs --no-color --tail=200

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: reports/standard/playwright
          retention-days: 14

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: reports/standard/allure
          retention-days: 14

      - name: Upload traces, videos and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            reports/_raw/test-results
            reports/_raw/junit.xml
          retention-days: 14

  publish-report:
    name: Publish report to GitHub Pages
    needs: e2e
    # Opt-in: set the repository variable PUBLISH_REPORT=true and enable Pages (Source: GitHub Actions).
    if: ${{ !cancelled() && vars.PUBLISH_REPORT == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: allure-report-chromium
          path: allure-report
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
