name: QA Accelerator Regulated Run

# A dry run (rehearsal) or a formal run (audit evidence) of the whole suite against a named application build.
# Manual only. Does nothing unless regulated mode is switched on in config/regulated.json. See docs/regulated.
#
# One-time setup in the repository settings (Settings, Environments):
#   dry-validation     no protection rules needed
#   formal-validation  add "Required reviewers": a named person must approve every formal run
# Formal runs must also start from a tag (see "allowedRefs" in config/regulated.json), so pick the release tag
# in "Use workflow from" when you run it.

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: dry (a rehearsal) or formal (audit evidence)
        type: choice
        options: [dry, formal]
        default: dry
      build_id:
        description: The application build or version under test (letters, digits, dots, dashes, underscores)
        type: string
        required: true
      dry_run_id:
        description: Formal runs only. The workflow run ID of the accepted dry run (the number in its address)
        type: string
        required: false
      execution_id:
        description: Optional. An Xray Test Execution key or similar, recorded in the evidence
        type: string
        required: false

concurrency:
  group: regulated-${{ inputs.build_id }}-${{ inputs.run_type }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Check regulated mode and the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_TYPE: ${{ inputs.run_type }}
      BUILD_ID: ${{ inputs.build_id }}
      DRY_RUN_ID: ${{ inputs.dry_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the request against config/regulated.json
        run: |
          args=(--gate --type "$RUN_TYPE" --build "$BUILD_ID")
          if [ "$RUN_TYPE" = "formal" ]; then args+=(--against "${DRY_RUN_ID:-}"); fi
          node tools/regulated-config.mjs "${args[@]}"

  run:
    name: ${{ inputs.run_type }} run, build ${{ inputs.build_id }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Formal runs wait here for the reviewers set on the formal-validation environment.
    environment: ${{ inputs.run_type == 'formal' && 'formal-validation' || 'dry-validation' }}
    env:
      CI: 'true'
      TEST_ENV: ci
      BROWSERS: chromium
      UI_URL: http://localhost:4200
      API_URL: http://localhost:8091
      APP_NAME: Toolshop
      # The database of the containers started below (see infra/toolshop/docker-compose.yml). These are the
      # throwaway credentials of that local container, not secrets.
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_USER: user
      DB_PASSWORD: root
      DB_NAME: toolshop
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      RUN_TYPE: ${{ inputs.run_type }}
      BUILD_ID: ${{ inputs.build_id }}
      EXECUTION_ID: ${{ inputs.execution_id }}
    steps:
      # The full history, so the run can record whether the commit is a tag and how it relates to the remote.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The application's web image is arm64-only; QEMU lets the x64 runner run it.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Start the application under test
        run: npm run app:start

      - name: Download the accepted dry run
        if: ${{ inputs.run_type == 'formal' }}
        uses: actions/download-artifact@v4
        with:
          name: regulated-dry-${{ inputs.build_id }}
          run-id: ${{ inputs.dry_run_id }}
          github-token: ${{ github.token }}
          path: reports/dry

      - name: Run, build the evidence pack and seal it
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
        run: |
          args=(--type "$RUN_TYPE" --build "$BUILD_ID")
          if [ -n "$EXECUTION_ID" ]; then args+=(--execution "$EXECUTION_ID"); fi
          if [ "$RUN_TYPE" = "formal" ]; then
            dry=$(ls reports/dry/*.zip | grep -v -- '-FAILED' | head -n 1)
            args+=(--against "$dry")
          fi
          npm run regulated:run -- "${args[@]}"

      - name: Application logs (on failure)
        if: failure()
        run: docker compose -f infra/toolshop/docker-compose.yml logs --no-color --tail=200

      # The sealed zip, its checksum and the audit log. GitHub keeps artifacts for a limited time: copy an approved
      # formal archive into your records (Xray, SharePoint) and check it with `npm run regulated:verify`.
      - name: Upload the sealed archive
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regulated-${{ inputs.run_type }}-${{ inputs.build_id }}
          path: reports/archive
          if-no-files-found: warn
          retention-days: ${{ vars.EVIDENCE_RETENTION_DAYS || 90 }}
