version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Playwright is upgraded by hand together with the Dockerfile image tag and the visual baselines.
      - dependency-name: '@playwright/test'
      # Major jumps (eslint, @types/node, dotenv, ...) are reviewed by hand, not proposed automatically.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the @playwright/test version; see above.
      - dependency-name: mcr.microsoft.com/playwright
