# Azure DevOps pipeline.
#
# Create a variable group named "qa-accelerator-secrets" (Pipelines > Library) with secret variables
# CUSTOMER_EMAIL, CUSTOMER_PASSWORD, ADMIN_EMAIL and ADMIN_PASSWORD, and authorize this pipeline to use it.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly
    branches:
      include: [main]
    always: true

variables:
  - group: qa-accelerator-secrets

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Use Node 20
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: |
      npm run lint
      npm run typecheck
      npm run format:check
    displayName: Lint, typecheck, format

  # The application's web image is arm64-only; this lets the x64 agent run it.
  - script: docker run --privileged --rm tonistiigi/binfmt --install arm64
    displayName: Enable arm64 emulation

  - script: npm run app:start
    displayName: Start the application under test

  - script: npx playwright install --with-deps chromium
    displayName: Install browser

  - script: npx playwright test
    displayName: Run tests
    env:
      CI: 'true'
      TEST_ENV: azure
      APP_NAME: Toolshop
      UI_URL: http://localhost:4200
      API_URL: http://localhost:8091
      CUSTOMER_EMAIL: $(CUSTOMER_EMAIL)
      CUSTOMER_PASSWORD: $(CUSTOMER_PASSWORD)
      ADMIN_EMAIL: $(ADMIN_EMAIL)
      ADMIN_PASSWORD: $(ADMIN_PASSWORD)

  - script: npx allure generate allure-results --clean
    displayName: Build Allure report
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      testRunTitle: QA Accelerator E2E

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright report
    condition: succeededOrFailed()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report

  - task: PublishPipelineArtifact@1
    displayName: Publish Allure report
    condition: succeededOrFailed()
    inputs:
      targetPath: allure-report
      artifact: allure-report

  - script: npm run app:stop
    displayName: Stop the application
    condition: always()
